# Evolution API — Self-hosted no Railway ou DigitalOcean
# Deploy: docker-compose up -d

version: "3.8"

services:
  evolution-api:
    image: atendai/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      # ─── Configuração básica ───────────────────────────
      SERVER_TYPE: "http"
      SERVER_PORT: "8080"
      SERVER_URL: "${EVOLUTION_SERVER_URL}"       # ex: https://seu-vps.railway.app

      # ─── Autenticação ──────────────────────────────────
      AUTHENTICATION_TYPE: "apikey"
      AUTHENTICATION_API_KEY: "${EVOLUTION_API_KEY}"

      # ─── Banco de dados ────────────────────────────────
      # Evolution usa Redis para sessões e PostgreSQL para dados
      DATABASE_ENABLED: "true"
      DATABASE_CONNECTION_URI: "${DATABASE_URL}"  # PostgreSQL do Supabase
      DATABASE_CONNECTION_CLIENT_NAME: "evolution_api"

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "${REDIS_URL}"             # Redis — Railway provê

      # ─── WhatsApp ──────────────────────────────────────
      WA_BUSINESS_TOKEN_WEBHOOK: "${EVOLUTION_API_KEY}"
      QRCODE_LIMIT: "30"
      QRCODE_COLOR: "#ff6b00"

      # ─── Webhook para o Next.js ────────────────────────
      WEBHOOK_GLOBAL_URL: "${NEXT_APP_URL}/api/webhook/whatsapp"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "false"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"

      # ─── Instâncias ────────────────────────────────────
      DEL_INSTANCE: "false"

    volumes:
      - evolution_data:/evolution/instances

volumes:
  evolution_data:

# ─── Como usar ────────────────────────────────────────────
# 1. Copie este arquivo para seu VPS/Railway
# 2. Configure as variáveis de ambiente
# 3. docker-compose up -d
# 4. Acesse: GET {SERVER_URL}/instance/create
#    Body: { "instanceName": "meirendeu", "qrcode": true }
# 5. Escaneie o QR code com o número do MEI Rendeu
